<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(160)">
      <stop offset="0%" stop-color="#2b0f14"/>
      <stop offset="45%" stop-color="#4a141d"/>
      <stop offset="100%" stop-color="#7A1F2B"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oliveGlow" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#556B2F" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#556B2F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.4" fill="#D4AF37" fill-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#goldGlow)"/>
  <rect width="1920" height="1080" fill="url(#oliveGlow)"/>
  <rect width="1920" height="1080" fill="url(#dots2)"/>
</svg>
